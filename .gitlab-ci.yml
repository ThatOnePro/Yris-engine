stages:
  - build
  - release

.publish_template:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - export DOTNET_VERSION=$(echo $CI_COMMIT_TAG | sed 's/^v//')
  artifacts:
    paths:
      - publish/
    expire_in: 1 week

build_linux:
  extends: .publish_template
  script:
    - dotnet publish -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true /p:Version=$DOTNET_VERSION /p:AssemblyName=Yris-$DOTNET_VERSION -o publish/linux

build_windows:
  extends: .publish_template
  script:
    - dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:Version=$DOTNET_VERSION /p:AssemblyName=Yris-$DOTNET_VERSION -o publish/windows

build_mac:
  extends: .publish_template
  script:
    - dotnet publish -c Release -r osx-x64 --self-contained true /p:PublishSingleFile=true /p:Version=$DOTNET_VERSION /p:AssemblyName=Yris-$DOTNET_VERSION -o publish/macos

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - job: build_linux
      artifacts: true
    - job: build_windows
      artifacts: true
    - job: build_mac
      artifacts: true
  before_script:
    - export DOTNET_VERSION=$(echo $CI_COMMIT_TAG | sed 's/^v//')
  script:
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "publish/linux/Yris-$DOTNET_VERSION" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/yris/${CI_COMMIT_TAG}/Yris-${DOTNET_VERSION}-linux"
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "publish/windows/Yris-$DOTNET_VERSION.exe" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/yris/${CI_COMMIT_TAG}/Yris-${DOTNET_VERSION}-windows.exe"
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "publish/macos/Yris-$DOTNET_VERSION" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/yris/${CI_COMMIT_TAG}/Yris-${DOTNET_VERSION}-macos"
  release:
    name: "Release $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: "Automated build for version $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Yris-$CI_COMMIT_TAG (Linux x64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/yris/${CI_COMMIT_TAG}/Yris-${CI_COMMIT_TAG#v}-linux"
          link_type: other
        - name: "Yris-$CI_COMMIT_TAG (Windows x64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/yris/${CI_COMMIT_TAG}/Yris-${CI_COMMIT_TAG#v}-windows.exe"
          link_type: other
        - name: "Yris-$CI_COMMIT_TAG (macOS x64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/yris/${CI_COMMIT_TAG}/Yris-${CI_COMMIT_TAG#v}-macos"
          link_type: other